<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRE & 後醫單字塔防大作戰</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #121212;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 800px;
            height: 95vh;
            background: #1a1a1a;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 2px solid #333;
            overflow: hidden;
            position: relative;
        }

        /* 頂部數據列 */
        #header-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #252525;
            border-bottom: 2px solid #333;
            z-index: 10;
        }

        .hud-item {
            font-size: 16px;
            font-weight: bold;
        }

        .hp-bar-container {
            width: 150px;
            height: 16px;
            background: #444;
            border-radius: 8px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            margin-left: 8px;
            border: 1px solid #666;
        }

        #hp-bar {
            width: 100%;
            height: 100%;
            background: #e74c3c;
            transition: width 0.3s ease;
        }

        /* 戰鬥畫面 (Canvas) */
        #battle-area {
            flex: 1;
            position: relative;
            background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 答題控制面板 */
        #control-panel {
            height: 48%;
            background: #222;
            border-top: 3px solid #444;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 10px;
        }

        /* 類別篩選按鈕 */
        #category-tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 4px;
            background: #333;
            color: #ccc;
            border: 1px solid #555;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.2s;
            text-align: center;
        }

        .tab-btn.active {
            background: #3498db;
            color: #fff;
            border-color: #2980b9;
            box-shadow: 0 0 8px rgba(52, 152, 219, 0.5);
        }

        /* 題目區域 */
        #question-box {
            background: #181818;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 16px;
            line-height: 1.4;
            color: #f1f1f1;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        /* 選項按鈕區 */
        #options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            flex: 1;
        }

        .option-btn {
            background: #2c3e50;
            color: #ecf0f1;
            border: 2px solid #34495e;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            padding: 10px;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            word-break: break-word;
        }

        .option-btn:hover:not(:disabled) {
            background: #34495e;
            border-color: #5d6d7e;
        }

        .option-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .option-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* 遊戲結束與載入遮罩 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            gap: 15px;
        }

        .overlay h1 {
            font-size: 32px;
            color: #e74c3c;
            text-shadow: 0 0 10px rgba(231, 76, 60, 0.5);
        }

        .overlay button {
            padding: 12px 30px;
            font-size: 18px;
            background: #27ae60;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .overlay button:hover {
            background: #2ecc71;
            transform: scale(1.05);
        }

        /* 答錯提示動畫 */
        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
            100% { transform: translateX(0); }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 載入中畫面 -->
    <div id="loading-overlay" class="overlay">
        <h2>載入題庫中，請稍候...</h2>
    </div>

    <!-- 遊戲結束畫面 -->
    <div id="gameover-overlay" class="overlay" style="display: none;">
        <h1 id="gameover-title">城牆失守！</h1>
        <p id="final-score" style="font-size: 20px;">擊退怪物數：0</p>
        <button onclick="restartGame()">重新開始</button>
    </div>

    <!-- 頂部資訊欄 -->
    <div id="header-hud">
        <div class="hud-item">
            城牆血量: 
            <div class="hp-bar-container">
                <div id="hp-bar"></div>
            </div>
        </div>
        <div class="hud-item" id="score-display">擊退數: 0</div>
    </div>

    <!-- 動畫與怪物戰鬥區 -->
    <div id="battle-area">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- 控制與答題面板 -->
    <div id="control-panel">
        <!-- 題庫類別切換 -->
        <div id="category-tabs">
            <button class="tab-btn active" onclick="switchCategory('ALL')">全部</button>
            <button class="tab-btn" onclick="switchCategory('字根字首')">1. 字根字首</button>
            <button class="tab-btn" onclick="switchCategory('介係詞')">2. 介係詞</button>
            <button class="tab-btn" onclick="switchCategory('慣用語')">3. 慣用語</button>
            <button class="tab-btn" onclick="switchCategory('片語')">4. 片語</button>
        </div>

        <!-- 題目顯示區 -->
        <div id="question-box">點擊下方按鈕開始答題</div>

        <!-- 4 個選項按鈕 -->
        <div id="options-grid">
            <button class="option-btn" onclick="checkAnswer(0)">選項 A</button>
            <button class="option-btn" onclick="checkAnswer(1)">選項 B</button>
            <button class="option-btn" onclick="checkAnswer(2)">選項 C</button>
            <button class="option-btn" onclick="checkAnswer(3)">選項 D</button>
        </div>
    </div>
</div>

<script>
    // --------------------------------------------------
    // 設定與變數
    // --------------------------------------------------
    // 請將下方網址替換為你部署好的 Google Apps Script Web App URL
    const API_URL = "YOUR_APPS_SCRIPT_WEB_APP_URL";

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let allQuestions = [];
    let filteredQuestions = [];
    let currentQuestion = null;
    
    let hp = 100;
    let score = 0;
    let gameActive = false;
    
    let monsters = [];
    let bullets = [];
    let currentCategory = 'ALL';
    
    // 怪物生成與移動速度參數 (整體移動時間約 10 秒)
    const MONSTER_SPEED = 0.8; 
    let spawnTimer = 0;

    // 備用測試題庫 (若 API 未設定或讀取失敗時使用)
    const fallbackQuestions = [
        { category: "介係詞", question: "We must rid the body _____ toxic substances.", optionA: "of", optionB: "from", optionC: "with", optionD: "out", answer: "A" },
        { category: "片語", question: "Researchers had some mosquitoes suck blood _____ the malaria parasite.", optionA: "plucked into", optionB: "laden with", optionC: "stemmed from", optionD: "referred to", answer: "B" },
        { category: "慣用語", question: "Africa was poised to become the next frontier _____ international terrorist organizations.", optionA: "out", optionB: "for", optionC: "in", optionD: "by", answer: "B" }
    ];

    // --------------------------------------------------
    // 初始化與資料載入
    // --------------------------------------------------
    function initCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }

    window.addEventListener('resize', initCanvas);

    async function loadQuestions() {
        try {
            if (API_URL === "YOUR_APPS_SCRIPT_WEB_APP_URL") {
                throw new Error("尚未設定 Apps Script API URL");
            }
            const res = await fetch(API_URL);
            allQuestions = await res.json();
        } catch (err) {
            console.warn("使用預設題庫 (請檢查 Apps Script 設定):", err);
            allQuestions = fallbackQuestions;
        } finally {
            document.getElementById("loading-overlay").style.display = "none";
            startGame();
        }
    }

    function startGame() {
        hp = 100;
        score = 0;
        monsters = [];
        bullets = [];
        gameActive = true;
        updateHUD();
        switchCategory(currentCategory);
        document.getElementById("gameover-overlay").style.display = "none";
        requestAnimationFrame(gameLoop);
    }

    // --------------------------------------------------
    // 類別切換與題目處理
    // --------------------------------------------------
    function switchCategory(cat) {
        currentCategory = cat;
        
        // 更新 UI 標籤樣式
        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach(btn => {
            btn.classList.remove('active');
            if(btn.innerText.includes(cat) || (cat === 'ALL' && btn.innerText === '全部')) {
                btn.classList.add('active');
            }
        });

        if (cat === 'ALL') {
            filteredQuestions = [...allQuestions];
        } else {
            filteredQuestions = allQuestions.filter(q => q.category && q.category.includes(cat));
        }

        if (filteredQuestions.length === 0) {
            filteredQuestions = [...allQuestions]; // 若無符合資料則載入全部
        }

        nextQuestion();
    }

    function nextQuestion() {
        if (!gameActive || filteredQuestions.length === 0) return;
        
        const randomIndex = Math.floor(Math.random() * filteredQuestions.length);
        currentQuestion = filteredQuestions[randomIndex];

        document.getElementById("question-box").innerText = `[${currentQuestion.category || '綜合'}] ${currentQuestion.question}`;
        
        const options = [currentQuestion.optionA, currentQuestion.optionB, currentQuestion.optionC, currentQuestion.optionD];
        const buttons = document.querySelectorAll(".option-btn");
        
        buttons.forEach((btn, index) => {
            btn.innerText = `${String.fromCharCode(65 + index)}. ${options[index] || ''}`;
            btn.disabled = false;
        });
    }

    function checkAnswer(selectedIndex) {
        if (!gameActive || !currentQuestion) return;

        const selectedLetter = String.fromCharCode(65 + selectedIndex); // "A", "B", "C", "D"
        const correctAnswer = (currentQuestion.answer || "").trim().toUpperCase();

        // 相容判斷：答案可能是 "A" 或直接為選項文字
        const isCorrect = (selectedLetter === correctAnswer) || 
                          (selectedIndex === 0 && correctAnswer === currentQuestion.optionA) ||
                          (selectedIndex === 1 && correctAnswer === currentQuestion.optionB) ||
                          (selectedIndex === 2 && correctAnswer === currentQuestion.optionC) ||
                          (selectedIndex === 3 && correctAnswer === currentQuestion.optionD);

        if (isCorrect) {
            // 答對：發射砲彈攻擊最前方的怪物
            shootMonster();
            score++;
            updateHUD();
            nextQuestion();
        } else {
            // 答錯：畫面震動提示
            const panel = document.getElementById("control-panel");
            panel.classList.add("shake");
            setTimeout(() => panel.classList.remove("shake"), 400);
        }
    }

    // --------------------------------------------------
    // 遊戲邏輯與繪圖引擎 (Canvas)
    // --------------------------------------------------
    function spawnMonsterGroup() {
        // 三三兩兩生成怪物 (1~3 隻)
        const count = Math.floor(Math.random() * 3) + 1;
        const laneWidth = canvas.width / 4;

        for (let i = 0; i < count; i++) {
            const lane = Math.floor(Math.random() * 4);
            const x = lane * laneWidth + laneWidth / 2;
            monsters.push({
                x: x,
                y: -30 - (i * 25), // 稍微錯開登場時間
                radius: 18,
                speed: MONSTER_SPEED + (Math.random() * 0.2 - 0.1), // 些微速度微調
                hp: 1,
                color: `hsl(${Math.random() * 360}, 70%, 50%)`
            });
        }
    }

    function shootMonster() {
        if (monsters.length === 0) return;

        // 鎖定 Y 軸最靠下（最接近城牆）的怪物
        let target = monsters[0];
        for (let m of monsters) {
            if (m.y > target.y) target = m;
        }

        bullets.push({
            x: canvas.width / 2,
            y: canvas.height - 10,
            targetX: target.x,
            targetY: target.y,
            targetMonster: target,
            speed: 12
        });
    }

    function updateHUD() {
        document.getElementById("hp-bar").style.width = `${Math.max(0, hp)}%`;
        document.getElementById("score-display").innerText = `擊退數: ${score}`;
    }

    function gameOver() {
        gameActive = false;
        document.getElementById("final-score").innerText = `總共擊退怪物數：${score}`;
        document.getElementById("gameover-overlay").style.display = "flex";
    }

    function restartGame() {
        startGame();
    }

    function gameLoop() {
        if (!gameActive) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. 定期生成怪物 (約每 4~6 秒生成一波)
        spawnTimer++;
        if (spawnTimer > 270) {
            spawnMonsterGroup();
            spawnTimer = 0;
        }

        // 2. 繪製底部城牆線
        const wallY = canvas.height - 15;
        ctx.fillStyle = "#7f8c8d";
        ctx.fillRect(0, wallY, canvas.width, 15);
        ctx.fillStyle = "#e74c3c";
        ctx.fillRect(canvas.width / 2 - 20, wallY - 10, 40, 10); // 砲台 base

        // 3. 更新與繪製怪物
        for (let i = monsters.length - 1; i >= 0; i--) {
            let m = monsters[i];
            m.y += m.speed;

            // 繪製怪物 (像素風格小球/小怪)
            ctx.beginPath();
            ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
            ctx.fillStyle = m.color;
            ctx.fill();
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.closePath();

            // 撞擊城牆判斷
            if (m.y + m.radius >= wallY) {
                monsters.splice(i, 1);
                hp -= 15; // 扣減城牆血量
                updateHUD();

                if (hp <= 0) {
                    gameOver();
                    return;
                }
            }
        }

        // 4. 更新與繪製砲彈
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            
            // 追蹤計算
            let dx = b.targetX - b.x;
            let dy = b.targetY - b.y;
            let dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < b.speed) {
                // 擊中怪物
                const mIndex = monsters.indexOf(b.targetMonster);
                if (mIndex !== -1) {
                    monsters.splice(mIndex, 1);
                }
                bullets.splice(i, 1);
            } else {
                b.x += (dx / dist) * b.speed;
                b.y += (dy / dist) * b.speed;

                ctx.beginPath();
                ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
                ctx.fillStyle = "#f1c40f";
                ctx.fill();
                ctx.closePath();
            }
        }

        requestAnimationFrame(gameLoop);
    }

    // 啟動遊戲
    window.onload = () => {
        initCanvas();
        loadQuestions();
    };
</script>
</body>
</html>
