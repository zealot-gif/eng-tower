<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRE & 學士後醫 單字塔防大作戰</title>
    <!-- 引入 Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 720px;
            height: 94vh;
            max-height: 900px;
            background: #1e293b;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border: 2px solid #334155;
            overflow: hidden;
            position: relative;
        }

        /* 頂部數據列 */
        #header-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: #0f172a;
            border-bottom: 2px solid #334155;
            z-index: 10;
            flex-shrink: 0;
        }

        .hud-item {
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hp-bar-container {
            width: 100px;
            height: 14px;
            background: #334155;
            border-radius: 999px;
            overflow: hidden;
            display: inline-block;
            border: 1px solid #475569;
        }

        #hp-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ef4444, #f87171);
            transition: width 0.3s ease;
        }

        .exp-bar-container {
            width: 60px;
            height: 10px;
            background: #334155;
            border-radius: 999px;
            overflow: hidden;
            display: inline-block;
            border: 1px solid #475569;
        }

        #exp-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            transition: width 0.3s ease;
        }

        .hud-btn {
            background: #334155;
            color: #e2e8f0;
            border: 1px solid #475569;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .hud-btn:hover {
            background: #475569;
            color: #fff;
        }

        /* 戰鬥畫面 (Canvas) */
        #battle-area {
            flex: 1;
            min-height: 180px;
            position: relative;
            background: linear-gradient(to bottom, #020617, #0f172a, #1e293b);
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 下方控制與答題面板 */
        #control-panel {
            background: #0f172a;
            border-top: 2px solid #334155;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 10px;
            flex-shrink: 0;
        }

        /* 類別切換按鈕列 */
        #category-tabs {
            display: flex;
            gap: 6px;
            justify-content: center;
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 6px 4px;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            transition: all 0.2s;
            text-align: center;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);
        }

        /* 題目顯示區 */
        #question-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            min-height: 60px;
            max-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
            color: #f8fafc;
            overflow-y: auto;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        /* 選項按鈕區 */
        #options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .option-btn {
            background: #1e293b;
            color: #e2e8f0;
            border: 1.5px solid #334155;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 10px 8px;
            min-height: 48px;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            word-break: break-word;
            line-height: 1.2;
        }

        .option-btn:hover:not(:disabled) {
            background: #334155;
            border-color: #64748b;
            color: #fff;
        }

        .option-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .option-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 全螢幕 Overlay 通用樣式 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .overlay-card {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 14px;
            padding: 24px;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-height: 85vh;
            overflow-y: auto;
        }

        .overlay h1 {
            font-size: 22px;
            color: #38bdf8;
            text-align: center;
            font-weight: 800;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .setting-label {
            font-size: 13px;
            font-weight: 700;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-label span.value-tag {
            color: #38bdf8;
            font-size: 13px;
        }

        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #334155;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
        }

        .select-input {
            width: 100%;
            padding: 8px 12px;
            background: #0f172a;
            color: #f8fafc;
            border: 1px solid #334155;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            font-weight: 600;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 800;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: #334155;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        /* 錯題複習清單樣式 */
        .wrong-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 12px;
            text-align: left;
        }

        .wrong-q {
            font-weight: 700;
            color: #38bdf8;
        }

        .wrong-ans {
            color: #10b981;
        }

        .wrong-user {
            color: #ef4444;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
            100% { transform: translateX(0); }
        }

        .shake {
            animation: shake 0.3s ease-in-out;
        }
    </style>
</head>
<body>

<!-- 預先在 HTML 載入 Font Awesome 圖示，確保 WebFont 被載入 -->
<div style="position: absolute; opacity: 0; pointer-events: none; font-family: 'Font Awesome 6 Free', 'Font Awesome 6 Brands'; font-weight: 900;">
    &#xf133; &#xf392; &#xf1e8; &#xf075; &#xf02e;
</div>

<div id="game-container">
    <!-- 1. 開始選單 Overlay -->
    <div id="start-overlay" class="overlay">
        <div class="overlay-card">
            <h1>⚔️ 單字塔防大作戰</h1>
            <p style="text-align: center; color: #94a3b8; font-size: 13px;">GRE & 學士後醫 英文單字複習遊戲</p>
            
            <div class="setting-group">
                <div class="setting-label">
                    <span>怪物速度 (難度)</span>
                    <span id="speed-label" class="value-tag">0.40 (輕鬆閱讀)</span>
                </div>
                <input type="range" min="0.2" max="1.0" step="0.05" value="0.4" class="slider" id="speed-slider" oninput="updateSpeedLabel(this.value)">
            </div>

            <div class="setting-group">
                <div class="setting-label">
                    <span>初始題庫類別</span>
                </div>
                <select id="start-category-select" class="select-input">
                    <option value="ALL">全部類別 (綜合考題)</option>
                    <option value="字根字首">1. 字根字首類</option>
                    <option value="介係詞">2. 介係詞類</option>
                    <option value="慣用語">3. 慣用語類</option>
                    <option value="片語">4. 片語類</option>
                </select>
            </div>

            <button class="btn-primary" onclick="confirmStartGame()">開始遊戲</button>
        </div>
    </div>

    <!-- 2. 載入中畫面 -->
    <div id="loading-overlay" class="overlay" style="display: none;">
        <h3 style="color: #38bdf8;">連線至 Google 題庫中...</h3>
    </div>

    <!-- 3. 遊戲結束畫面 -->
    <div id="gameover-overlay" class="overlay" style="display: none;">
        <div class="overlay-card" style="text-align: center;">
            <h1 style="color: #ef4444;">🏰 城牆失守！</h1>
            <p id="final-score" style="font-size: 16px; font-weight: 700;">擊退怪物數：0</p>
            <p id="final-wave" style="font-size: 14px; color: #94a3b8;">到達波次：Wave 1</p>
            <button class="btn-primary" onclick="openWrongList()">📖 檢視錯題清單</button>
            <button class="btn-secondary" onclick="showStartMenu()">返回主選單</button>
        </div>
    </div>

    <!-- 4. 錯題清單 Modal -->
    <div id="wrong-overlay" class="overlay" style="display: none;">
        <div class="overlay-card">
            <h1>📖 錯題總複習</h1>
            <div id="wrong-list-container" style="display: flex; flex-direction: column; gap: 8px; max-height: 50vh; overflow-y: auto;">
                <!-- 動態注入錯題 -->
            </div>
            <button class="btn-secondary" onclick="clearWrongList()" style="background: #ef4444; border-color: #dc2626;">清空錯題紀錄</button>
            <button class="btn-primary" onclick="closeWrongList()">關閉</button>
        </div>
    </div>

    <!-- 頂部資訊欄 -->
    <div id="header-hud">
        <div class="hud-item">
            <span>城牆:</span> 
            <div class="hp-bar-container">
                <div id="hp-bar"></div>
            </div>
        </div>
        <div class="hud-item">
            <span id="level-display">Lv.1</span>
            <div class="exp-bar-container">
                <div id="exp-bar"></div>
            </div>
        </div>
        <div class="hud-item" id="wave-display" style="color: #f59e0b;">Wave 1 (0/25)</div>
        <div class="hud-item" id="score-display">擊退: 0</div>
        <button class="hud-btn" onclick="openWrongList()">📖 錯題 (<span id="wrong-count">0</span>)</button>
        <button class="hud-btn" onclick="pauseToMenu()">⚙️ 設定</button>
    </div>

    <!-- Canvas 戰鬥區 -->
    <div id="battle-area">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- 控制面板 -->
    <div id="control-panel">
        <div id="category-tabs">
            <button class="tab-btn active" onclick="switchCategory('ALL')">全部</button>
            <button class="tab-btn" onclick="switchCategory('字根字首')">字根字首</button>
            <button class="tab-btn" onclick="switchCategory('介係詞')">介係詞</button>
            <button class="tab-btn" onclick="switchCategory('慣用語')">慣用語</button>
            <button class="tab-btn" onclick="switchCategory('片語')">片語</button>
        </div>

        <div id="question-box">點擊開始遊戲後顯示題目</div>

        <div id="options-grid">
            <button class="option-btn" onclick="checkAnswer(0)">選項 A</button>
            <button class="option-btn" onclick="checkAnswer(1)">選項 B</button>
            <button class="option-btn" onclick="checkAnswer(2)">選項 C</button>
            <button class="option-btn" onclick="checkAnswer(3)">選項 D</button>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwhs2tvovfWU9im0sEVcZU1pXDVDLNCqlBPICw6xq3GtizFciqdpeFx3NQVDiZ_QDAMGA/exec";

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let allQuestions = [];
    let filteredQuestions = [];
    let currentQuestion = null;
    
    let hp = 100;
    let score = 0;
    let gameActive = false;
    
    // 等級與波次機制
    let level = 1;
    let exp = 0;
    let expToNextLevel = 100;
    let currentWave = 1;
    let waveKills = 0;
    const MONSTERS_PER_WAVE = 25;
    
    // 錯題清單
    let wrongQuestions = [];
    
    let monsters = [];
    let bullets = [];
    let currentCategory = 'ALL';
    
    let monsterSpeed = 0.4;
    let spawnTimer = 0;

    const fallbackQuestions = [
        { category: "字根字首", question: "The word 'BENEVOLENT' contains 'bene-' (well/good). It means:", optionA: "Kind and generous", optionB: "Harmful and evil", optionC: "Quick and agile", optionD: "Silent and deep", answer: "A" },
        { category: "字根字首", question: "In 'MALICIOUS', the prefix 'mal-' indicates:", optionA: "Excessive", optionB: "Bad or evil", optionC: "Underneath", optionD: "Across", answer: "B" },
        { category: "介係詞", question: "Patients with acute symptoms are prone _____ complications.", optionA: "to", optionB: "with", optionC: "for", optionD: "at", answer: "A" },
        { category: "介係詞", question: "We must rid the body _____ toxic metabolic waste.", optionA: "from", optionB: "of", optionC: "with", optionD: "out", answer: "B" },
        { category: "慣用語", question: "The breakthrough came 'out of the blue'. It means:", optionA: "Expectedly", optionB: "Unexpectedly", optionC: "Gradually", optionD: "Inevitably", answer: "B" },
        { category: "片語", question: "The doctor urged the patient to _____ smoking immediately.", optionA: "refrain from", optionB: "take up with", optionC: "comply into", optionD: "resort with", answer: "A" }
    ];

    // 各類型怪物與砲台對應的 Font Awesome Icon 配置
    const ICON_CONFIG = {
        cannon: { code: '\uf133', font: '900 24px "Font Awesome 6 Free"' },            // 砲台: 日曆 fa-calendar
        "字根字首": { code: '\uf392', font: '900 22px "Font Awesome 6 Brands"' },     // Discord
        "介係詞": { code: '\uf1e8', font: '900 22px "Font Awesome 6 Brands"' },       // Twitch
        "慣用語": { code: '\uf075', font: '400 20px "Font Awesome 6 Free"' },          // Comment (Regular)
        "片語": { code: '\uf02e', font: '400 20px "Font Awesome 6 Free"' },            // Bookmark (Regular)
        default: { code: '\uf075', font: '400 20px "Font Awesome 6 Free"' }
    };

    function updateSpeedLabel(val) {
        const speed = parseFloat(val);
        monsterSpeed = speed;
        let title = "輕鬆閱讀";
        if (speed > 0.35 && speed <= 0.6) title = "標準戰鬥";
        else if (speed > 0.6 && speed <= 0.8) title = "快速思考";
        else if (speed > 0.8) title = "極速挑戰";

        document.getElementById("speed-label").innerText = `${speed.toFixed(2)} (${title})`;
    }

    function confirmStartGame() {
        const catSelect = document.getElementById("start-category-select").value;
        currentCategory = catSelect;
        document.getElementById("start-overlay").style.display = "none";
        
        if (allQuestions.length === 0) {
            loadQuestions();
        } else {
            startGame();
        }
    }

    function pauseToMenu() {
        gameActive = false;
        document.getElementById("start-overlay").style.display = "flex";
    }

    function showStartMenu() {
        document.getElementById("gameover-overlay").style.display = "none";
        document.getElementById("start-overlay").style.display = "flex";
    }

    function initCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }

    window.addEventListener('resize', initCanvas);

    async function loadQuestions() {
        document.getElementById("loading-overlay").style.display = "flex";
        try {
            if (API_URL === "YOUR_APPS_SCRIPT_WEB_APP_URL") {
                throw new Error("尚未設定 Apps Script API URL");
            }
            const res = await fetch(API_URL);
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
                allQuestions = data;
            } else {
                throw new Error("API 格式不符");
            }
        } catch (err) {
            console.warn("載入預設題庫:", err);
            allQuestions = fallbackQuestions;
        } finally {
            document.getElementById("loading-overlay").style.display = "none";
            startGame();
        }
    }

    function startGame() {
        hp = 100;
        score = 0;
        level = 1;
        exp = 0;
        expToNextLevel = 100;
        currentWave = 1;
        waveKills = 0;
        monsters = [];
        bullets = [];
        spawnTimer = 0;
        gameActive = true;
        
        initCanvas();
        updateHUD();
        switchCategory(currentCategory);
        document.getElementById("gameover-overlay").style.display = "none";
        
        requestAnimationFrame(gameLoop);
    }

    function switchCategory(cat) {
        currentCategory = cat;
        
        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach(btn => {
            btn.classList.remove('active');
            if (btn.innerText === cat || (cat === 'ALL' && btn.innerText === '全部')) {
                btn.classList.add('active');
            }
        });

        if (cat === 'ALL') {
            filteredQuestions = [...allQuestions];
        } else {
            filteredQuestions = allQuestions.filter(q => q.category && q.category.includes(cat));
        }

        if (filteredQuestions.length === 0) {
            filteredQuestions = [...allQuestions];
        }

        nextQuestion();
    }

    function nextQuestion() {
        if (filteredQuestions.length === 0) return;
        
        const randomIndex = Math.floor(Math.random() * filteredQuestions.length);
        currentQuestion = filteredQuestions[randomIndex];

        document.getElementById("question-box").innerText = `[${currentQuestion.category || '綜合'}] ${currentQuestion.question}`;
        
        const options = [currentQuestion.optionA, currentQuestion.optionB, currentQuestion.optionC, currentQuestion.optionD];
        const buttons = document.querySelectorAll(".option-btn");
        
        buttons.forEach((btn, index) => {
            btn.innerText = `${String.fromCharCode(65 + index)}. ${options[index] || ''}`;
            btn.disabled = false;
        });
    }

    function checkAnswer(selectedIndex) {
        if (!gameActive || !currentQuestion) return;

        const selectedLetter = String.fromCharCode(65 + selectedIndex);
        const correctAnswer = (currentQuestion.answer || "").trim().toUpperCase();

        const isCorrect = (selectedLetter === correctAnswer) || 
                          (selectedIndex === 0 && correctAnswer === currentQuestion.optionA) ||
                          (selectedIndex === 1 && correctAnswer === currentQuestion.optionB) ||
                          (selectedIndex === 2 && correctAnswer === currentQuestion.optionC) ||
                          (selectedIndex === 3 && correctAnswer === currentQuestion.optionD);

        if (isCorrect) {
            shootMonster();
            score++;
            waveKills++;
            addExp(35); // 答對加 35 經驗值

            // 波次升級判斷 (每 25 隻怪物進入下一波)
            if (waveKills >= MONSTERS_PER_WAVE) {
                currentWave++;
                waveKills = 0;
            }

            updateHUD();
            nextQuestion();
        } else {
            // 答錯：紀錄錯題
            recordWrongQuestion(currentQuestion, selectedLetter);
            
            const panel = document.getElementById("control-panel");
            panel.classList.add("shake");
            setTimeout(() => panel.classList.remove("shake"), 300);
        }
    }

    function addExp(amount) {
        exp += amount;
        if (exp >= expToNextLevel) {
            exp -= expToNextLevel;
            level++;
            expToNextLevel = Math.floor(expToNextLevel * 1.3);
            hp = Math.min(100, hp + 30); // 升級恢復 30 城牆血量
        }
    }

    function recordWrongQuestion(q, userChoice) {
        // 避免重複紀錄相同問題
        const exists = wrongQuestions.some(item => item.question === q.question);
        if (!exists) {
            wrongQuestions.push({
                ...q,
                userChoice: userChoice
            });
            document.getElementById("wrong-count").innerText = wrongQuestions.length;
        }
    }

    function openWrongList() {
        const container = document.getElementById("wrong-list-container");
        container.innerHTML = "";

        if (wrongQuestions.length === 0) {
            container.innerHTML = `<p style="text-align: center; color: #94a3b8; font-size: 14px;">尚無錯題紀錄，做得好！🎉</p>`;
        } else {
            wrongQuestions.forEach((q, idx) => {
                const item = document.createElement("div");
                item.className = "wrong-item";
                item.innerHTML = `
                    <div class="wrong-q">${idx + 1}. [${q.category || '綜合'}] ${q.question}</div>
                    <div>你的選擇：<span class="wrong-user">${q.userChoice}</span></div>
                    <div>正確答案：<span class="wrong-ans">${q.answer}</span></div>
                `;
                container.appendChild(item);
            });
        }

        document.getElementById("wrong-overlay").style.display = "flex";
    }

    function closeWrongList() {
        document.getElementById("wrong-overlay").style.display = "none";
    }

    function clearWrongList() {
        wrongQuestions = [];
        document.getElementById("wrong-count").innerText = "0";
        openWrongList();
    }

    function spawnMonsterGroup() {
        const count = Math.floor(Math.random() * 2) + 1;
        const laneWidth = canvas.width / 4;
        const categories = ["字根字首", "介係詞", "慣用語", "片語"];

        for (let i = 0; i < count; i++) {
            const lane = Math.floor(Math.random() * 4);
            const x = lane * laneWidth + laneWidth / 2;
            
            // 隨機指定類型或採用當前過濾類別
            let cat = currentCategory === 'ALL' ? categories[Math.floor(Math.random() * categories.length)] : currentCategory;

            // 隨波次稍微提升速度
            const speedMultiplier = 1 + (currentWave - 1) * 0.08;

            monsters.push({
                x: x,
                y: -20 - (i * 25),
                radius: 18,
                category: cat,
                speed: (monsterSpeed + (Math.random() * 0.1 - 0.05)) * speedMultiplier,
                color: `hsl(${Math.random() * 360}, 75%, 60%)`
            });
        }
    }

    function getClosestTarget() {
        if (monsters.length === 0) return null;
        let target = monsters[0];
        for (let m of monsters) {
            if (m.y > target.y) target = m; // 找最接近底部的怪物
        }
        return target;
    }

    function shootMonster() {
        const target = getClosestTarget();
        if (!target) return;

        bullets.push({
            x: canvas.width / 2,
            y: canvas.height - 15,
            targetX: target.x,
            targetY: target.y,
            targetMonster: target,
            speed: 12
        });
    }

    function updateHUD() {
        document.getElementById("hp-bar").style.width = `${Math.max(0, hp)}%`;
        document.getElementById("score-display").innerText = `擊退: ${score}`;
        document.getElementById("level-display").innerText = `Lv.${level}`;
        document.getElementById("exp-bar").style.width = `${Math.min(100, (exp / expToNextLevel) * 100)}%`;
        document.getElementById("wave-display").innerText = `Wave ${currentWave} (${waveKills}/${MONSTERS_PER_WAVE})`;
    }

    function gameOver() {
        gameActive = false;
        document.getElementById("final-score").innerText = `擊退怪物數：${score}`;
        document.getElementById("final-wave").innerText = `到達波次：Wave ${currentWave}`;
        document.getElementById("gameover-overlay").style.display = "flex";
    }

    function gameLoop() {
        if (!gameActive) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        spawnTimer++;
        const spawnInterval = Math.max(80, Math.floor(160 / monsterSpeed));
        if (spawnTimer > spawnInterval) {
            spawnMonsterGroup();
            spawnTimer = 0;
        }

        // 畫底層城牆
        const wallY = canvas.height - 12;
        ctx.fillStyle = "#475569";
        ctx.fillRect(0, wallY, canvas.width, 12);
        
        // 畫砲台基座
        const cannonX = canvas.width / 2;
        const cannonY = wallY;
        
        ctx.fillStyle = "#38bdf8";
        ctx.beginPath();
        ctx.arc(cannonX, cannonY, 18, Math.PI, 0);
        ctx.fill();

        // 計算砲台對準最近怪物的角度
        let angle = 0; // 預設向上 (0度)
        const targetMonster = getClosestTarget();
        if (targetMonster) {
            const dx = targetMonster.x - cannonX;
            const dy = targetMonster.y - cannonY;
            // atan2 0 度朝向 X 軸正方向，旋轉角計算調整（往上為 -90 度）
            angle = Math.atan2(dy, dx) + Math.PI / 2;
        }

        // 畫砲台 Font Awesome 圖示 (旋轉方向)
        ctx.save();
        ctx.translate(cannonX, cannonY - 8); // 將原點移至砲台中心
        ctx.rotate(angle);                    // 依目標角度旋轉
        ctx.font = ICON_CONFIG.cannon.font;
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(ICON_CONFIG.cannon.code, 0, 0);
        ctx.restore();

        // 繪製與更新怪物
        for (let i = monsters.length - 1; i >= 0; i--) {
            let m = monsters[i];
            m.y += m.speed;

            // 畫怪物圓形背景
            ctx.beginPath();
            ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
            ctx.fillStyle = m.color;
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.closePath();

            // 畫怪物 Font Awesome 圖示
            ctx.save();
            const iconCfg = ICON_CONFIG[m.category] || ICON_CONFIG.default;
            ctx.font = iconCfg.font;
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(iconCfg.code, m.x, m.y);
            ctx.restore();

            // 怪物撞擊城牆判斷
            if (m.y + m.radius >= wallY) {
                monsters.splice(i, 1);
                hp -= 15;
                updateHUD();

                if (hp <= 0) {
                    gameOver();
                    return;
                }
            }
        }

        // 繪製與更新子彈
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            let dx = b.targetX - b.x;
            let dy = b.targetY - b.y;
            let dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < b.speed) {
                const mIndex = monsters.indexOf(b.targetMonster);
                if (mIndex !== -1) {
                    monsters.splice(mIndex, 1);
                }
                bullets.splice(i, 1);
            } else {
                b.x += (dx / dist) * b.speed;
                b.y += (dy / dist) * b.speed;

                ctx.beginPath();
                ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
                ctx.fillStyle = "#f59e0b";
                ctx.fill();
                ctx.closePath();
            }
        }

        requestAnimationFrame(gameLoop);
    }

    // 確保字體準備就緒後啟動初始設定
    document.fonts.ready.then(() => {
        initCanvas();
        updateSpeedLabel(document.getElementById("speed-slider").value);
    });

    window.onload = () => {
        initCanvas();
        updateSpeedLabel(document.getElementById("speed-slider").value);
    };
</script>
</body>
</html>
